<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Île aux Syllabes - Completo</title>
<style>
:root {
  --ocean:#0EA5A0; --ocean-dark:#0B7F7A; --coral:#FF6B5B; --sunshine:#FFC145;
  --plum:#3D2352; --sky:#8EE3F5; --cream:#FFFDF7; --pink:#FF9AC1; --lilac:#B497F5;
  --leaf:#6FCF6F; --radius:26px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Quicksand', sans-serif;
  background: linear-gradient(180deg, var(--sky), var(--ocean) 55%, var(--ocean-dark));
  min-height: 100vh;
  color: var(--plum);
  overflow-x: hidden;
}
h1, h2, h3 { font-family: 'Baloo 2', cursive; }
#app { max-width: 900px; margin: 0 auto; padding: 18px 18px 60px; min-height: 100vh; }
.screen { display: none; }
.screen.active { display: block; animation: fadein .35s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--cream); cursor: pointer; }
.brand .logo { font-size: 34px; }
.brand h1 { font-size: 22px; margin: 0; color: var(--cream); }
.stars-badge { background: var(--sunshine); color: var(--plum); font-family: 'Baloo 2'; font-weight: 800; padding: 8px 16px; border-radius: 999px; display: flex; gap: 6px; box-shadow: 0 4px 0 #d99a1f; font-size: 18px; }
.icon-btn { background: rgba(255,255,255,.25); border: none; border-radius: 999px; width: 44px; height: 44px; font-size: 20px; color: var(--cream); cursor: pointer; }
.home-hero { text-align: center; color: var(--cream); margin: 10px 0 26px; }
.home-hero h2 { font-size: 32px; margin: 0 0 6px; }
.home-hero p { font-size: 17px; margin: 0; }
.card-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .card-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { .card-grid { grid-template-columns: 1fr; } }
.menu-card { background: var(--cream); border-radius: var(--radius); padding: 22px 18px; text-align: center; cursor: pointer; border: none; box-shadow: 0 8px 0 rgba(0,0,0,.15); font-family: 'Baloo 2'; transition: transform .15s; }
.menu-card:hover { transform: translateY(-4px); }
.menu-card .emoji { font-size: 48px; display: block; margin-bottom: 8px; }
.menu-card h3 { margin: 0 0 4px; font-size: 20px; }
.menu-card p { margin: 0; font-size: 14px; font-family: 'Quicksand'; color: #6b5a7a; font-weight: 600; }
.menu-card.c1 { background: linear-gradient(160deg, #FFE9C7, var(--sunshine)); }
.menu-card.c2 { background: linear-gradient(160deg, #FFD3CC, var(--coral)); }
.menu-card.c3 { background: linear-gradient(160deg, #D7F5D0, var(--leaf)); }
.menu-card.c4 { background: linear-gradient(160deg, #E3D6FB, var(--lilac)); }
.menu-card.c5 { background: linear-gradient(160deg, #CDEFFA, var(--sky)); }
.menu-card.c6 { background: linear-gradient(160deg, #FFD7EA, var(--pink)); }
.panel { background: var(--cream); border-radius: var(--radius); padding: 22px; box-shadow: 0 8px 0 rgba(0,0,0,.12); position: relative; }
.back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.back-btn { background: var(--cream); color: var(--plum); border: none; border-radius: 999px; padding: 10px 18px; font-family: 'Baloo 2'; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
.screen-title { color: var(--cream); font-size: 26px; margin: 0; }
.big-btn { font-family: 'Baloo 2'; font-weight: 700; font-size: 17px; border: none; border-radius: 18px; padding: 14px 22px; cursor: pointer; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
.btn-coral { background: var(--coral); }
.btn-ocean { background: var(--ocean); }
.btn-leaf { background: var(--leaf); }
.btn-lilac { background: var(--lilac); }
.btn-sun { background: var(--sunshine); color: var(--plum); }
.word-emoji { font-size: 80px; text-align: center; margin: 6px 0 18px; }
.target-slots { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
.slot { min-width: 64px; height: 64px; border-radius: 16px; border: 3px dashed #cbb8e0; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2'; font-size: 24px; font-weight: 700; background: #faf7ff; }
.slot.filled { border-style: solid; }
.stones { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.stone { font-family: 'Baloo 2'; font-weight: 800; font-size: 22px; padding: 16px 20px; border-radius: 20px; color: #fff; border: none; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.2); }
.stone-0 { background: var(--coral); }
.stone-1 { background: var(--ocean); }
.stone-2 { background: var(--lilac); }
.stone-3 { background: var(--sunshine); color: var(--plum); }
.game-controls { display: flex; justify-content: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.progress-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #e3dcf0; }
.dot.done { background: var(--leaf); }
.dot.current { background: var(--coral); }
.flashcard { font-family: 'Baloo 2'; font-weight: 800; font-size: 56px; text-align: center; background: #faf7ff; border: 4px solid #e0d5f5; border-radius: 24px; padding: 30px 20px; margin: 0 0 18px; }
.celebrate { text-align: center; font-family: 'Baloo 2'; font-size: 22px; color: var(--leaf); min-height: 30px; }
.quiz-emoji { font-size: 70px; text-align: center; }
.quiz-q { text-align: center; font-family: 'Baloo 2'; font-size: 19px; margin-bottom: 20px; }
.quiz-opts { display: grid; gap: 12px; max-width: 420px; margin: 0 auto; }
.quiz-opt { font-family: 'Baloo 2'; font-size: 20px; font-weight: 700; padding: 16px; border-radius: 16px; border: 3px solid #eee; background: #fff; cursor: pointer; }
.quiz-opt.correct { background: var(--leaf); color: #fff; }
.quiz-opt.wrong { background: var(--coral); color: #fff; }
.score-screen { text-align: center; }
.score-screen .big-emoji { font-size: 70px; }
.story-list { display: grid; gap: 12px; }
.story-item { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 18px; padding: 14px 16px; box-shadow: 0 4px 0 rgba(0,0,0,.08); cursor: pointer; }
.story-item .emoji { font-size: 36px; }
.story-item .info h4 { margin: 0; font-family: 'Baloo 2'; font-size: 17px; }
.story-item .info p { margin: 2px 0 0; font-size: 13px; color: #7a6b8a; font-weight: 600; }
.add-story-box { margin-top: 18px; padding: 16px; border-radius: 18px; background: #f5f0ff; }
.add-story-box textarea, .add-story-box input { width: 100%; font-family: 'Quicksand'; font-weight: 600; font-size: 15px; border: 2px solid #e0d5f5; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
.story-reader { font-size: 26px; line-height: 1.9; font-weight: 600; }
.sentence { padding: 2px 4px; border-radius: 6px; cursor: pointer; }
.sentence.highlight { background: #FFF3B0; }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 2px solid #f1ecf9; }
.toggle { width: 52px; height: 30px; border-radius: 999px; background: #e0d5f5; position: relative; cursor: pointer; border: none; }
.toggle.on { background: var(--leaf); }
.toggle .knob { width: 24px; height: 24px; border-radius: 50%; background: #fff; position: absolute; top: 3px; left: 3px; transition: .2s; }
.toggle.on .knob { left: 25px; }
.voice-slot { background: #f5f0ff; border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
.voice-slot-label { font-family: 'Baloo 2'; font-weight: 700; font-size: 15px; border: none; border-bottom: 2px dashed #cbb8e0; background: #fff; border-radius: 8px 8px 0 0; width: 100%; margin-bottom: 8px; padding: 6px 8px; }
.voice-slot-controls { display: flex; gap: 8px; flex-wrap: wrap; }
.mini-btn { font-family: 'Baloo 2'; font-weight: 700; font-size: 13px; border: none; border-radius: 12px; padding: 8px 12px; cursor: pointer; color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.mini-lilac { background: var(--lilac); }
.mini-leaf { background: var(--leaf); }
.mini-sun { background: var(--sunshine); color: var(--plum); }
.mini-coral { background: var(--coral); }
.mini-ocean { background: var(--ocean); }
.voice-slot-status { font-size: 12px; color: #7a6b8a; font-weight: 600; margin: 6px 0 0; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); display: inline-block; animation: pulse 1s infinite; margin-right: 6px; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
@keyframes dynamic-star { 0% { transform: translate(0,0) scale(.5); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1.8); opacity: 0; } }
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="topbar">
    <div class="brand" onclick="goHome()"><span class="logo">🏝️</span><h1>L'Île aux Syllabes</h1></div>
    <div style="display:flex;gap:10px"><div class="stars-badge">⭐ <span id="star-count">0</span></div></div>
  </div>

<!-- CATEGORY PICKER -->

<!-- SYLLABLE PRONUNCIATIONS -->

<script>
/* ==========================================
   AUDIO E STELLE (SUONI ALTERNATI E ANIMAZIONI)
   ========================================== */
let audioCtx = null;
let lastSound = "";

function playJingle(type) {
  try {
    // Lancia SEMPRE le stelle volanti
    launchStars(25);

    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Scegli un suono casuale, ma mai lo stesso due volte di fila
    let sounds = ['success', 'applause', 'sparkle'];
    let pick = sounds[Math.floor(Math.random() * sounds.length)];
    if (pick === lastSound) {
      pick = sounds[(sounds.indexOf(pick) + 1) % sounds.length];
    }
    lastSound = pick;

    if (pick === 'success') {
      // MELODIA ALLEGRA (3 note)
      [523, 659, 783].forEach((f, i) => {
        let o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = f; o.type = 'sine';
        g.gain.setValueAtTime(.2, audioCtx.currentTime + i * .1);
        g.gain.exponentialRampToValueAtTime(.01, audioCtx.currentTime + i * .1 + .15);
        o.start(audioCtx.currentTime + i * .1); o.stop(audioCtx.currentTime + i * .1 + .15);
      });
    } else if (pick === 'applause') {
      // APPLAUSI (rumore bianco)
      let bs = audioCtx.sampleRate * .8;
      let bf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
      let dt = bf.getChannelData(0);
      for (let i = 0; i < bs; i++) {
        dt[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bs, 2);
      }
      let src = audioCtx.createBufferSource();
      src.buffer = bf;
      let g = audioCtx.createGain();
      g.gain.value = .3;
      src.connect(g); g.connect(audioCtx.destination);
      src.start();
    } else {
      // CAMPANELLA (tintinnio)
      for (let i = 0; i < 5; i++) {
        let o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = 1200 + Math.random() * 500;
        o.type = 'triangle';
        g.gain.setValueAtTime(.15, audioCtx.currentTime + i * .08);
        g.gain.exponentialRampToValueAtTime(.01, audioCtx.currentTime + i * .08 + .1);
        o.start(audioCtx.currentTime + i * .08); o.stop(audioCtx.currentTime + i * .08 + .1);
      }
    }
  } catch (e) {}
}

/* STELLE CHE VOLANO */
function launchStars(n) {
  let c = document.querySelector('.screen.active .panel');
  if (!c) return;

  document.querySelectorAll('.dynamic-star').forEach(s => s.remove());

  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      let s = document.createElement('div');
      s.className = 'dynamic-star';
      s.textContent = ['⭐', '✨', '🌟', '💖'][Math.floor(Math.random() * 4)];
      s.style.cssText = `position:absolute; left:50%; top:50%; font-size:${25 + Math.random() * 30}px; pointer-events:none; z-index:9999; opacity:1`;
      c.appendChild(s);
      s.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
      s.style.setProperty('--ty', (-(150 + Math.random() * 100)) + 'px');
      s.style.setProperty('--rot', (Math.random() * 360) + 'deg');
      s.style.animation = 'dynamic-star 1.2s ease-out forwards';
      setTimeout(() => s.remove(), 1300);
    }, i * 30);
  }
}
/* ==========================================
   DATI INIZIALI E VARIABILI GLOBALI
   ========================================== */
let stars = 0;
let currentLang = 'it';
let customWords = [];
let customSentences = [];

// Storie di esempio (bilingue)
let stories = [
  { id: 1, lang: "it", title: "Il gattino", emoji: "🐱", text: "Un piccolo gatto vive in giardino. Gli piace cacciare le farfalle." },
  { id: 2, lang: "fr", title: "Le petit chat", emoji: "🐱", text: "Un petit chat vit dans un jardin. Il aime chasser les papillons." }
];

// Parole precaricate in Italiano
const WORDS_IT = [
  { word: "casa", syllables: ["ca", "sa"], emoji: "🏠", category: "Casa" },
  { word: "gatto", syllables: ["gat", "to"], emoji: "🐱", category: "Animali" },
  { word: "cane", syllables: ["ca", "ne"], emoji: "🐶", category: "Animali" },
  { word: "sole", syllables: ["so", "le"], emoji: "☀️", category: "Natura" },
  { word: "luna", syllables: ["lu", "na"], emoji: "🌙", category: "Natura" },
  { word: "mela", syllables: ["me", "la"], emoji: "🍎", category: "Cibo" },
  { word: "treno", syllables: ["tre", "no"], emoji: "🚂", category: "Trasporti" },
  { word: "pesce", syllables: ["pe", "sce"], emoji: "🐟", category: "Animali" },
  { word: "auto", syllables: ["au", "to"], emoji: "🚗", category: "Trasporti" },

/* ==========================================
   SALVATAGGIO AUTOMATICO
   ========================================== */
let save = () => localStorage.setItem('data', JSON.stringify({
  stars, currentLang, customWords, customSentences, stories
}));

let load = () => {
  try {
    let d = JSON.parse(localStorage.getItem('data'));
    if (d) {
      stars = d.stars || 0;
      currentLang = d.currentLang || 'it';
      customWords = d.customWords || [];
      customSentences = d.customSentences || [];
      stories = d.stories || stories;
    }
  } catch (e) {}

/* ==========================================
   FUNZIONI BASE (NAVIGAZIONE, VOCE, CATEGORIE)
   ========================================== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.speechSynthesis.cancel();
}

function goHome() { showScreen('screen-home'); }

function addStars(n) {
  stars += n;
  document.getElementById('star-count').textContent = stars;
  save();
}

/* Sintesi vocale */
function speak(text, rate, onend, lang) {
  let u = new SpeechSynthesisUtterance(text);
  u.lang = (lang === 'fr') ? 'fr-FR' : 'it-IT';
  u.rate = rate || 0.9;
  if (onend) u.onend = onend;
  window.speechSynthesis.speak(u);
}

/* Lista parole per lingua */
function wordPool(lang) {
  return (lang === 'fr' ? WORDS_FR : WORDS_IT).concat(customWords.filter(w => w.lang === lang));
}

/* Mostra emoji o immagine */
function iconHtml(w, size) {
  return `<span style="font-size:${size * 0.8}px">${w.emoji || ''}</span>`;
}

/* Apri schermata categorie */
function openCategoryPicker(type) {
  let cats = [...new Set(wordPool(currentLang).map(w => w.category))];
  document.getElementById('category-grid').innerHTML = 
    `<button class="menu-card c1" onclick="pickCategory(null, '${type}')"><span class="emoji">🌈</span><h3>Tutti</h3></button>` +
    cats.map(c => `<button class="menu-card c5" onclick="pickCategory('${c}', '${type}')"><span class="emoji">🏷️</span><h3>${c}</h3></button>`).join('');
  showScreen('screen-category');
}

/* Scegli categoria e avvia gioco */
function pickCategory(cat, type) {
  let pool = wordPool(currentLang);
  if (cat) pool = pool.filter(w => w.category === cat);
  if (type === 'syllables') startSyllableGame(pool);
  else if (type === 'words') startWordReading(pool);
  else if (type === 'quiz') startQuiz(pool);
  else if (type === 'sound') startSoundGame(pool);
  else if (type === 'sentences') startSentenceGame(null);
}/* ==========================================
   GIOCO DELLE SILLABE
   ========================================== */
let gw = [];  // Parole del gioco

let ge = 0;   // Indice sillaba corrente

let qq = [];  // Domande del quiz
let qi = 0;   // Indice domanda corrente
let qs = 0;   // Punteggio

function startQuiz(list) {
  let pool = list || wordPool(currentLang);
  qq = [...pool].sort(() => Math.random() - .5).slice(0, 5)
    .map(w => {
      let wrongs = wordPool(w.lang)
        .filter(x => x.word !== w.word)
        .sort(() => Math.random() - .5)
        .slice(0, 2)
        .map(x => x.word);
      return {
        emoji: w.emoji,
        answer: w.word,
        options: [w.word, ...wrongs].sort(() => Math.random() - .5)
      };
    });
  qi = 0;
  qs = 0;
  showScreen('screen-quiz');
  renderQuizQuestion();
}

function renderQuizQuestion() {
  let q = qq[qi];
  document.getElementById('quiz-panel').innerHTML = `
    <div class="quiz-emoji">${q.emoji}</div>
    <div class="quiz-q">Qual è questa parola?</div>
    <div class="quiz-opts">
      ${q.options.map(o => `<button class="quiz-opt" onclick="answerQuiz('${o}', this)">${o}</button>`).join('')}
    </div>
  `;
}

function answerQuiz(choice, btn) {
  let q = qq[qi];
  let ok = (choice === q.answer);

  if (ok) {
    btn.classList.add('correct');
    playJingle('success');
    addStars(1);
  } else {
    playJingle('wrong');
    btn.classList.add('wrong');
  }

  document.querySelectorAll('.quiz-opt').forEach(x => x.disabled = true);
  qi++;

  setTimeout(() => {
    if (qi < qq.length) {
      renderQuizQuestion();
    } else {
      document.getElementById('quiz-panel').innerHTML = `
        <div class="score-screen">
          <div class="big-emoji">🏆</div>
          <h2>${qs} / ${qq.length}</h2>
          <button class="big-btn btn-coral" onclick="startQuiz()">Rigioca</button>
        </div>

    }
  }, 1200);

    .filter(w => w.word[0].toUpperCase() !== letter && w.word !== target.word)

    [target, ...wrongs].sort(() => Math.random() - .5)

let syllableRecordings = {};

// Crea la chiave univoca per una sillaba (lingua + sillaba)
function syllableRecordingKey(syllable, lang) {
  return lang + ':' + syllable.toLowerCase();
}

// Mostra la lista delle pronunce registrate
function renderSyllablePronunciations() {
  let el = document.getElementById('syllable-pronunciations-list');
  el.innerHTML = '';

  Object.entries(syllableRecordings).forEach(([key, value]) => {
    el.innerHTML += `
      <div class="story-item">
        <div class="info">
          <h4>${value.syllable}</h4>
        </div>
        <button class="icon-btn" style="background:var(--coral)" 
          onclick="delete syllableRecordings['${key}']; renderSyllablePronunciations(); save()">🗑️</button>
      </div>
    `;
  });
}

// Controlla se la sillaba scritta esiste già o è nuova
function checkPronunciationInput(type) {
  let input = document.getElementById('new-pronunciation-syllable');
  let status = document.getElementById('syllable-status-msg');
  let controls = document.getElementById('syllable-inline-controls');

  if (input.value.trim()) {
    status.textContent = syllableRecordings[syllableRecordingKey(input.value.trim(), currentLang)] 
      ? '✅ Esiste' 
      : '🆕 Nuova';
    controls.style.display = 'flex';
  } else {
    controls.style.display = 'none';
  }
}

// Registra la voce per una sillaba
async function toggleInlineRecordSyllable() {
  let syllable = document.getElementById('new-pronunciation-syllable').value.trim();
  if (!syllable) return;

  let key = syllableRecordingKey(syllable, currentLang);

  try {
    let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    let recorder = new MediaRecorder(stream);
    let chunks = [];

    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      let blob = new Blob(chunks, { type: 'audio/webm' });
      let reader = new FileReader();
      reader.onload = () => {
        syllableRecordings[key] = { syllable: syllable, url: reader.result };
        save();
        renderSyllablePronunciations();
        document.getElementById('btn-play-syllable').style.display = 'inline-flex';
        document.getElementById('btn-delete-syllable').style.display = 'inline-flex';
      };
      reader.readAsDataURL(blob);
    };

    recorder.start();
    setTimeout(() => recorder.stop(), 2000); // Registra per 2 secondi
  } catch (e) {
    alert('Microfono non disponibile');
  }
}

// Ascolta la sillaba registrata
function playInlineSyllable() {
  let syllable = document.getElementById('new-pronunciation-syllable').value.trim();
  let recording = syllableRecordings[syllableRecordingKey(syllable, currentLang)];
  if (recording) new Audio(recording.url).play();
}

// Cancella la sillaba registrata
function deleteInlineSyllable() {
  let syllable = document.getElementById('new-pronunciation-syllable').value.trim();
  delete syllableRecordings[syllableRecordingKey(syllable, currentLang)];
  renderSyllablePronunciations();
  save();
}/* ==========================================

   ========================================== */

  currentLang = 'it';

  renderStoryList();
  renderMyWords();
  renderSyllablePronunciations();
}

// Avvia l'app quando la pagina è caricata
window.onload = initApp;

let audioCtx = null;
let lastSound = "";

function playJingle(type) {
  try {
    // SEMPRE stelle volanti
    launchStars(30);

    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Genera APPLAUSI veri (rumore bianco)
    if (Math.random() < 0.5) {
      let bs = audioCtx.sampleRate * 1;
      let bf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
      let dt = bf.getChannelData(0);
      for (let i = 0; i < bs; i++) {
        dt[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bs, 2);
      }
      let src = audioCtx.createBufferSource();
      src.buffer = bf;
      let g = audioCtx.createGain();
      g.gain.value = 0.4;
      src.connect(g); g.connect(audioCtx.destination);
      src.start();
    } else {
      // Melodia allegra
      [523, 659, 783].forEach((f, i) => {
        let o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = f; o.type = 'sine';
        g.gain.setValueAtTime(.2, audioCtx.currentTime + i * .1);
        g.gain.exponentialRampToValueAtTime(.01, audioCtx.currentTime + i * .1 + .15);
        o.start(audioCtx.currentTime + i * .1); o.stop(audioCtx.currentTime + i * .1 + .15);
      });
    }
  } catch (e) {}
}

function openStory(id) {
  currentStoryId = id;
  let s = stories.find(x => x.id === id);
  document.getElementById('reader-title').textContent = s.title;
  document.getElementById('reader-text').innerHTML = s.text.split(/(?<=[.!?])\s+/).map(x => `<span class="sentence">${x}</span>`).join(' ');
  showScreen('screen-reader');
}

function toggleReadStory() {
  let s = stories.find(x => x.id === currentStoryId);
  let i = 0;
  let sentences = s.text.split(/(?<=[.!?])\s+/);
  document.querySelectorAll('.sentence').forEach(el => el.classList.remove('highlight'));
  document.getElementById('reader-text').children[0].classList.add('highlight');
  function next() {
    if (i >= sentences.length) return;
    document.querySelectorAll('.sentence').forEach(el => el.classList.remove('highlight'));
    document.getElementById('reader-text').children[i].classList.add('highlight');
    speak(sentences[i], 0.9, () => { i++; next(); }, s.lang);
  }
  next();
}
</script><script>
/* ==========================================
   LINGUA E VOCI (ITALIANO / FRANCESE)
   ========================================== */
let voicesList = [];
let selectedVoiceURI = { fr: null, it: null };

function setLang(lang) {
  currentLang = lang;
  // Aggiorna il pulsante attivo
  document.querySelectorAll('.lang-seg-btn').forEach(b => b.classList.remove('active'));
  if (lang === 'fr') {
    document.getElementById('lang-btn-fr').classList.add('active');
  } else {
    document.getElementById('lang-btn-it').classList.add('active');
  }
  save();
  // Aggiorna le schermate
  renderStoryList();
  renderMyWords();
}

function loadVoices() {
  voicesList = window.speechSynthesis.getVoices();
  
  // Scegli voci di default per lingua
  let itVoice = voicesList.find(v => v.lang && v.lang.toLowerCase().startsWith('it'));
  let frVoice = voicesList.find(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
  
  if (itVoice && !selectedVoiceURI.it) selectedVoiceURI.it = itVoice.name;
  if (frVoice && !selectedVoiceURI.fr) selectedVoiceURI.fr = frVoice.name;
  
  // Aggiorna i menu a tendina nelle impostazioni
  populateVoiceSelect('settings-voice-select-fr', 'fr');
  populateVoiceSelect('settings-voice-select-it', 'it');
}

function populateVoiceSelect(id, lang) {
  let sel = document.getElementById(id);
  if (!sel) return;
  sel.innerHTML = '';
  let opts = voicesList.filter(v => v.lang && v.lang.toLowerCase().startsWith(lang));
  
  opts.forEach(v => {
    let o = document.createElement('option');
    o.value = v.name;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  });
  
  if (selectedVoiceURI[lang]) sel.value = selectedVoiceURI[lang];
}

function speak(text, rate, onend, lang) {
  let u = new SpeechSynthesisUtterance(text);
  let targetLang = lang || currentLang;
  u.lang = targetLang === 'fr' ? 'fr-FR' : 'it-IT';
  u.rate = rate || 0.9;
  
  // Cerca la voce selezionata
  let voice = voicesList.find(v => v.name === selectedVoiceURI[targetLang]);
  if (!voice) voice = voicesList.find(v => v.lang && v.lang.toLowerCase().startsWith(targetLang));
  if (voice) u.voice = voice;
  
  if (onend) u.onend = onend;
  window.speechSynthesis.speak(u);
}

// Inizializza le voci
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();
</script><script>
/* ==========================================
   IMPOSTAZIONI VOCI (MENU A TENDINA)
   ========================================== */
function renderSettings() {
  // Mostra il menu delle impostazioni
  showScreen('screen-settings');
  
  // Popola i menu a tendina con le voci disponibili
  populateVoiceSelect('settings-voice-select-fr', 'fr');
  populateVoiceSelect('settings-voice-select-it', 'it');
}

// Funzione per testare la voce selezionata
function testVoice(lang) {
  let text = lang === 'fr' ? 'Bonjour! Comment ça va?' : 'Ciao! Come stai?';
  speak(text, 0.9, null, lang);
}

// Salva la voce scelta quando si cambia selezione
function saveVoiceSelection(lang) {
  let selId = lang === 'fr' ? 'settings-voice-select-fr' : 'settings-voice-select-it';
  let sel = document.getElementById(selId);
  if (sel) {
    selectedVoiceURI[lang] = sel.value;
    save();
  }
}

// Aggiungi gli eventi di ascolto ai menu
document.addEventListener('DOMContentLoaded', () => {
  let frSel = document.getElementById('settings-voice-select-fr');
  let itSel = document.getElementById('settings-voice-select-it');
  
  if (frSel) frSel.addEventListener('change', () => saveVoiceSelection('fr'));
  if (itSel) itSel.addEventListener('change', () => saveVoiceSelection('it'));
});
</script><script>
/* ==========================================
   AGGIUNGI PULSANTE IMPOSTAZIONI NELLA HOME
   ========================================== */
// Questa funzione viene chiamata quando si clicca sul pulsante Impostazioni
function openSettings() {
  renderSettings();
}

// Aggiungi il pulsante Impostazioni alla barra superiore
document.addEventListener('DOMContentLoaded', () => {
  let topbar = document.querySelector('#screen-home .topbar');
  if (topbar) {
    let settingsBtn = document.createElement('button');
    settingsBtn.className = 'icon-btn';
    settingsBtn.innerHTML = '⚙️';
    settingsBtn.onclick = openSettings;
    topbar.appendChild(settingsBtn);
  }
});
</script>
